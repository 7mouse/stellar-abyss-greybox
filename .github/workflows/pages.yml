# 网页版（HTML5，单线程）构建并部署到 GitHub Pages
# 一次部署包含两版：main → 站点根路径；open-map-m1 → /open-map/（预览）
# 本工作流始终以 main 为 ref 运行（Pages 环境只允许 main 部署）。
# open-map-m1 分支上的 .github/workflows/preview-trigger.yml 在该分支 push 时
# 通过 workflow_dispatch 触发本工作流（ref=main）。
# 需要：仓库 Settings → Pages → Source 选 “GitHub Actions”
name: 网页版部署

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT_TAG: 4.7.2-stable
  PREVIEW_BRANCH: open-map-m1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          path: preview

      - name: 安装 Godot 与网页导出模板
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv "Godot_v${GODOT_TAG}_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j tpl.tpz templates/web_nothreads_release.zip templates/web_nothreads_debug.zip templates/version.txt -d "$T"
          rm tpl.tpz
          pip install fonttools

      - name: 自动验收（无头）main
        working-directory: main
        run: tests/run_tests.sh

      - name: 自动验收（无头）open-map-m1
        working-directory: preview
        run: tests/run_tests.sh

      - name: 导出网页版（根路径 + /open-map/）
        run: |
          mkdir -p site/open-map
          (cd main && godot --headless --export-release "Web" ../site/index.html)
          (cd preview && godot --headless --export-release "Web" ../site/open-map/index.html)
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
